name: CI

# CPU test + lint gate for gpudge.
#
# What runs here vs. what skips:
#   - GPU-gated tests (the `needs_cuda` skipif in tests/conftest.py — a skipif,
#     not a registered marker, so `pytest -m needs_cuda` selects nothing) skip
#     on the CPU runner.
#   - The three shardad-gated suites (tests/test_shard_stream.py,
#     tests/test_cell_stream.py, tests/test_inmem_external_ref_gpu.py) each
#     carry a module-level `pytest.importorskip("shardad")`, so all three files
#     skip entirely without the private `[streaming]` extra. Between them that
#     is 141 cases, 70 of which need no GPU.
#   - The real-data tests (tests/test_real_data.py) skip when the dataset path
#     is absent (it always is on CI).
# So this job goes green on a stock CPU runner with no GPU and without the
# `[streaming]` extra — meaning no shardad git-SSH dependency is fetched.
#
# The `[fast]` extra (numba) IS installed: the numba CSR kernel is a CPU
# code path, so installing it exercises that code on CI rather than the
# scipy fallback.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # One cell per supported interpreter. 3.11 is the declared floor
    # (pyproject `requires-python`), 3.12 is the developer pin
    # (.python-version / environment.yml). tests/test_python_floor.py fails if
    # this list and the pyproject floor ever drift apart — keep the versions
    # QUOTED, or YAML turns "3.10" into the float 3.1.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # setup-uv's `python-version` does three things: sets UV_PYTHON, creates
      # a venv on that interpreter, and activates it for later steps — so there
      # is deliberately NO separate `uv venv` step below. It also matters for
      # correctness: the repo ships `.python-version` = 3.12, and without
      # UV_PYTHON the 3.11 cell's `uv run --no-sync` falls back to uv's "Using
      # incompatible environment" path.
      #
      # `cache-dependency-glob` points the cache key at pyproject.toml because
      # the defaults (**/uv.lock, **/requirements*.txt) match nothing here —
      # uv.lock is git-ignored in this repo. No `cache-suffix` is needed: v5's
      # computeKeys() already interpolates the resolved Python version into the
      # key, so the two matrix cells never share one.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml

      # Install with `uv pip` (NOT `uv sync`): a fresh `uv sync` builds uv's
      # universal lock, which resolves EVERY source in [tool.uv.sources] —
      # including the private shardad git-SSH source — even when the
      # `streaming` extra isn't requested, and the no-SSH runner can't clone it
      # (Permission denied (publickey)). `uv pip install` does pip-style
      # resolution of only the requested extras, so shardad (streaming-only) is
      # never touched. torch resolves from PyPI here (the cu126 source is also
      # skipped), which is fine: CI is CPU-only and GPU tests skip. `[fast]`
      # (numba) IS installed so the numba CSR kernel — a CPU code path — is
      # exercised rather than the scipy fallback.
      - name: Install dependencies
        run: uv pip install -e ".[dev,fast]"

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src/ tests/ examples/

      - name: Tests (pytest)
        run: uv run --no-sync pytest tests/

  # Branch protection on `main` requires the status check context `test`. The
  # matrix above publishes `pytest (3.11)` / `pytest (3.12)` instead, so this
  # job republishes the matrix verdict under the required name. Do NOT rename
  # it without also updating the required checks in branch protection.
  #
  # `if: always()` + an explicit result check is deliberate: with a bare
  # `needs:` this job would be SKIPPED when the matrix fails, and a skipped
  # required check does not block a merge the way a failed one does. Testing
  # for equality with `success` (not inequality with `failure`) makes
  # `cancelled` and `skipped` fail closed too.
  test:
    runs-on: ubuntu-latest
    needs: pytest
    if: always()
    steps:
      - name: Verify the pytest matrix succeeded
        run: |
          result='${{ needs.pytest.result }}'
          echo "pytest matrix result: $result"
          [ "$result" = "success" ] || exit 1
