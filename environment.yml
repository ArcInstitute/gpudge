# Conda / mamba environment for gpudge.
#
# gpudge has no conda-forge package. So conda/mamba just provides Python + pip, and pip installs gpudge
# (and the CUDA 12.6 torch build) from the git tag.
#
#   mamba env create -f environment.yml   # or: conda env create -f environment.yml
#   mamba activate gpudge
#
# The host needs an NVIDIA driver and a CUDA GPU with enough VRAM for the
# reference pool; torch's CUDA libraries ship inside the pip wheel, so no
# conda CUDA toolkit is needed.
#
# For the optional `de(archive=...)` streaming path, also install shardad
# (private, shardad[cell]>=0.7.1) and switch the extra to [fast,streaming]:
#   - "shardad[cell] @ git+ssh://git@github.com/ArcInstitute/shardad.git@v0.7.1"
# (for GPU device decode use shardad[cell,gpu] via the streaming-gpu extra; pin
#  the v0.7.1 tag, matching README and pyproject's [tool.uv.sources]. v0.7.1 is
#  the floor for BOTH archive layouts: v0.5.6 predates layout='cell' entirely,
#  and gather_rows(n_threads=) -- which the cell path uses for every gather --
#  first shipped in v0.7.1.)
name: gpudge
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - "gpudge[fast] @ git+https://github.com/ArcInstitute/gpudge.git@v0.7.0"
