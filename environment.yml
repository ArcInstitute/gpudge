# Conda / mamba environment for gpudge.
#
# gpudge has no conda package (it's a private repo; conda-forge is for public
# packages). So conda/mamba just provides Python + pip, and pip installs gpudge
# (and the CUDA 12.6 torch build) from the git tag.
#
#   mamba env create -f environment.yml   # or: conda env create -f environment.yml
#   mamba activate gpudge
#
# Requires GitHub SSH access to ArcInstitute. The host needs an NVIDIA driver +
# an H100/A100/Hopper GPU; torch's CUDA libraries ship inside the pip wheel, so
# no conda CUDA toolkit is needed.
#
# For the optional `de(shard_archive=...)` streaming path, also install shardad
# (private) and switch the extra to [fast,streaming]:
#   - "shardad @ git+ssh://git@github.com/ArcInstitute/shardad.git@35e82bf"
# (the target-aware reader API landed after the v0.2.0 tag; pin the commit
#  matching README and pyproject's [tool.uv.sources].)
name: gpudge
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - "gpudge[fast] @ git+ssh://git@github.com/ArcInstitute/gpudge.git@v0.3.0"
