[project]
name = "gpudge"
version = "0.3.1"
description = "Lightweight GPU-only Mann–Whitney U differential expression."
readme = "README.md"
authors = [{ name = "Arc Institute" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.12",
    "hdf5plugin>=6.0.0",
    "numpy>=2",
    "polars>=1.38",
    "pyarrow>=20",
    "scipy>=1.17",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "scanpy>=1.12"]
fast = ["numba>=0.59"]
# Optional: streaming a shardad archive directly (de(shard_archive=...)).
# The core library takes an in-memory AnnData and does NOT need shardad.
streaming = ["shardad>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpudge"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "platform_system == 'Linux'" }]
# shardad is the OPTIONAL `streaming` extra only (the core library takes an
# in-memory AnnData and never imports shardad). It is hosted privately at
# ArcInstitute/shardad until PyPI distribution is decided, so this source
# pins a commit via SSH for `uv sync --extra streaming`; switch to a PyPI
# version string once it's published. Pinned to main@35e82bf (v0.2.1.dev)
# rather than the v0.2.0 tag because the target-aware reader API that
# de(shard_archive=...) depends on — write_sharded(group_by=, reference=)
# and ShardedArchive.read_reference/iter_group_shards/read_group — landed
# after v0.2.0 was tagged and is not yet in a release tag.
shardad = { git = "ssh://git@github.com/ArcInstitute/shardad.git", rev = "35e82bf4bd3b0b297847fc2c4fee640620ee78b9" }

[tool.pytest.ini_options]
testpaths = ["tests"]
