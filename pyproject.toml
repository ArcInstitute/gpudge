[project]
name = "gpudge"
version = "0.9.0"
description = "Lightweight GPU-only Mann–Whitney U differential expression."
readme = "README.md"
authors = [{ name = "Arc Institute" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "single-cell", "differential-expression", "mann-whitney", "wilcoxon",
    "crispr", "perturbation-screen", "gpu", "cuda",
]
# No `License ::` classifier: the `license` key above already carries it, and
# declaring both is what PEP 639 deprecates.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.12",
    "hdf5plugin>=6.0.0",
    "numpy>=2",
    "polars>=1.38",
    "pyarrow>=20",
    "scipy>=1.17",
    "torch>=2.5",
]

[project.urls]
Homepage = "https://github.com/ArcInstitute/gpudge"
Repository = "https://github.com/ArcInstitute/gpudge"
Changelog = "https://github.com/ArcInstitute/gpudge/blob/main/CHANGELOG.md"
Issues = "https://github.com/ArcInstitute/gpudge/issues"

[project.optional-dependencies]
# ruff is UPPER-BOUNDED on purpose. CI installs fresh (`uv pip install -e
# ".[dev,fast]"`) and so floats to the newest ruff, while developers run the
# pinned venv — an unbounded `ruff>=0.6` therefore turns every ruff minor
# release into a surprise red `test` check on code that did not change. That
# is exactly what 0.16.0 did: it reports 106 errors (import ordering, literal
# rewrites) on a tree that 0.15.x calls clean, so `main` went red without a
# single commit. Bump this bound deliberately, in its own PR, together with
# whatever fixes the new ruff wants.
#
# scanpy is NON-RUNTIME (tests/test_real_data.py, tests/test_review_coverage.py,
# and the benchmarks/ scripts) and its floor tracks the Python floor, not a
# feature we need: scanpy >= 1.12 declares `requires-python >= 3.12`, so pinning
# it there would make `[dev]` unresolvable on 3.11 — the very version this
# package now supports. 3.11 resolves 1.11.5; 3.12 still gets 1.12.x.
#
# pyyaml is declared rather than leaned on: tests/test_python_floor.py parses
# .github/workflows/ci.yml, and PyYAML is NOT a guaranteed transitive here —
# torch gates it behind an extra, and it currently arrives only via
# anndata -> zarr 3 -> donfig, a chain anndata's `zarr>=2.18.7,!=3.0.*` does not
# require.
dev = ["pytest>=8", "ruff>=0.6,<0.16", "scanpy>=1.11", "pyyaml>=6"]
fast = ["numba>=0.59"]
# Optional: streaming a cellstream archive directly (de(archive=...)).
# The core library takes an in-memory AnnData and does NOT need cellstream.
# `streaming` is the CPU-friendly base: pulls no CUDA-only wheels onto host-only
# / CPU-CI installs. cellstream is the former `shardad`, renamed and published
# to PyPI at 0.9.0; the floor is that first public release rather than the old
# private v0.7.1 pin. The [gpu] extra is cupy + nvcomp, needed for device
# decode; it belongs
# here rather than surfacing as a bare ImportError at open time.
#
# NOT `cellstream[cell]`. That extra is `pyfastpfor`, which publishes an sdist
# only -- so requiring it makes every install compile C++ -- and cellstream
# 0.9.0's own reader says "pyfastpfor is deliberately NOT imported here ... The
# Rust decoder never calls pyfastpfor". The Rust extension is non-optional as of
# the rename, so the wheel path never needs it; the pure-Python fallback raises
# an actionable "install pyfastpfor" error if it is ever reached.
streaming = ["cellstream>=0.9.0"]
# `streaming-gpu` adds GPU device decode (GroupShard.x_cupy()) via cellstream's
# [gpu] extra (cupy-cuda12x + nvidia-nvcomp-cu12). Recommended install for GPU
# users on SHARD-layout archives; there is no x_cupy equivalent for the cell
# codec, so cell-layout archives take the host CSR path either way.
streaming-gpu = ["cellstream[gpu]>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpudge"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "platform_system == 'Linux'" }]
# NOTE: there is deliberately no `cellstream` entry here. It used to be a
# private git-SSH source pinned to `shardad`'s v0.7.1 tag; since the rename it
# resolves from PyPI like any other dependency, so the `streaming` extra above
# is the whole story. Removing it also removes the reason CI had to use
# `uv pip install` rather than `uv sync` -- see .github/workflows/ci.yml.
#
# Two caveats that hung off the old pin are gone with it: cellstream's Rust
# extension is no longer optional (a source build without a toolchain now fails
# loudly rather than falling back to the slow pure-Python cell decoder), and the
# categorical-ordering defect that scoped cross-layout byte-identity to
# default-ordered archives was fixed upstream in 0.8.0, below this floor.

[tool.pytest.ini_options]
testpaths = ["tests"]
